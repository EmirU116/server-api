# Plain HTTP for the custom domain. Let's Encrypt checks domain ownership
# here; every other request is sent to HTTPS. The public IP keeps its own
# HTTP site (serverwatch.conf).
server {
    listen 80;
    server_name @SERVER_NAMES@;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

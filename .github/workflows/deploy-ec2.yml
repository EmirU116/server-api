name: Deploy ServerWatch Compose to EC2

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      api_image:
        type: string
        required: true
      web_image:
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (inputs.target == 'staging' || inputs.target == 'production')
    environment: ${{ inputs.target }}
    runs-on: ${{ vars.SERVERWATCH_DEPLOY_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Deploy and verify by digest
        env:
          TARGET: ${{ inputs.target }}
          API_IMAGE: ${{ inputs.api_image }}
          WEB_IMAGE: ${{ inputs.web_image }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_RELEASE_SIGNING_KEY: ${{ secrets.DEPLOY_RELEASE_SIGNING_KEY }}
        run: bash scripts/deployment/ssh_compose.sh "$TARGET" "$GITHUB_SHA" "$API_IMAGE" "$WEB_IMAGE"
